<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #ffe6f0, #ffffff);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: background 1s;
}

body.night {
  background: linear-gradient(135deg, #2b1055, #7597de);
}

.card {
  background: white;
  padding: 30px;
  border-radius: 24px;
  text-align: center;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 20px 50px rgba(255,105,180,0.35);
  animation: heartbeat 2.5s infinite;
  position: relative;
}

@keyframes heartbeat {
  0% { transform: scale(1); }
  30% { transform: scale(1.03); }
  60% { transform: scale(1); }
  100% { transform: scale(1.03); }
}

h1 { color: #ff4d88; }
p { color: #555; font-size: 18px; }

.buttons {
  position: relative;
  height: 150px;
  margin-top: 30px;
}

button {
  padding: 12px 30px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}

#yesBtn {
  background: #ff4d88;
  color: white;
}

#noBtn {
  background: #f1f1f1;
  position: absolute;
  top: 20px;
  left: 55%;
  transition: transform 0.2s;
}

#funnyText, #noTyped {
  margin-top: 15px;
  color: #ff4d88;
  font-weight: 600;
  min-height: 26px;
}

.typewriter {
  font-size: 17px;
  color: #444;
  margin-top: 10px;
  min-height: 60px;
}

.countdown {
  font-size: 28px;
  color: #ff4d88;
  margin: 10px 0;
}

.hidden { display: none; }

.secret {
  font-size: 17px;
  color: #ff1f6b;
  font-weight: 600;
}

.heart {
  position: absolute;
  font-size: 18px;
  animation: float 5s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); opacity: 0; }
  to { transform: translateY(-10vh); opacity: 1; }
}

.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9f3d8e4b29.mp3">
</audio>

<div class="card" id="mainCard">
  <h1 id="title">Hey Love ❤️</h1>
  <p>Will you be my Valentine?</p>

  <div class="buttons" id="buttonArea">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <div id="funnyText"></div>
  <div class="typewriter" id="noTyped"></div>
  <div class="countdown hidden" id="noCountdown"></div>
  <div class="secret hidden" id="noSecret">
    Okay… this NO path is just foreplay 😌❤️
  </div>
</div>

<div class="card hidden" id="final">
  <h1>GOOD CHOICE 😏❤️</h1>
  <p>You chose us.</p>
</div>

<script>
const params = new URLSearchParams(location.search);
const name = params.get("name") || "Love";
const mood = params.get("mood") || "romantic";
document.getElementById("title").textContent = `Hey ${name} ❤️`;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const funnyText = document.getElementById("funnyText");
const noTyped = document.getElementById("noTyped");
const noCountdown = document.getElementById("noCountdown");
const noSecret = document.getElementById("noSecret");
const area = document.getElementById("buttonArea");
const music = document.getElementById("music");

let attempts = 0;
let musicStarted = false;

const messages = [
  "Nice try 😏",
  "Still no? Cute 😂",
  "That button is panicking 💅",
  "Heart already said YES ❤️",
  "Stop flirting with NO 😌",
  "You’re enjoying this, aren’t you? 😏"
];

const noTypedMessages = {
  romantic: `Hey ${name}… every time you try NO, my heart pulls you closer.`,
  funny: `Breaking news 📰 ${name} still can’t press NO 😂`,
  soft: `${name}, even this hesitation feels warm and sweet 💕`
};

function typeText(el, text) {
  el.textContent = "";
  let i = 0;
  const t = setInterval(() => {
    el.textContent += text[i++];
    if (i >= text.length) clearInterval(t);
  }, 35);
}

function startNoCountdown() {
  noCountdown.classList.remove("hidden");
  let n = 3;
  noCountdown.textContent = n;
  const t = setInterval(() => {
    n--;
    noCountdown.textContent = n;
    if (n === 0) {
      clearInterval(t);
      noCountdown.classList.add("hidden");
      noSecret.classList.remove("hidden");
    }
  }, 800);
}

function moveNo() {
  if (!musicStarted) { music.play(); musicStarted = true; }

  const maxX = area.clientWidth - noBtn.offsetWidth;
  const maxY = area.clientHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random()*maxX + "px";
  noBtn.style.top = Math.random()*maxY + "px";
  noBtn.style.transform = `scale(${Math.max(0.6,1-attempts*0.05)})`;

  funnyText.textContent = messages[Math.min(attempts, messages.length-1)];
  attempts++;

  if (attempts === 3) document.body.classList.add("night");
  if (attempts === 4) typeText(noTyped, noTypedMessages[mood]);
  if (attempts === 6) startNoCountdown();
}

["mouseover","touchstart","click"].forEach(e =>
  noBtn.addEventListener(e, moveNo)
);

yesBtn.onclick = () => {
  document.getElementById("mainCard").classList.add("hidden");
  document.getElementById("final").classList.remove("hidden");
};
</script>

</body>
</html>
